name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - profile

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      # `flutter create .` scaffolds platform folders (android/, ios/) without
      # touching the existing lib/ or pubspec.yaml. It's a no-op the second time.
      # `flutter create` may rewrite pubspec.yaml with its default template
      # when run in an existing directory. We back it up first and restore it
      # so our pinned dependencies survive.
      - name: Scaffold android/ platform folder
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib.bak
          flutter create . \
            --platforms=android \
            --org com.expensebudgetmanager \
            --project-name expense_budget_manager
          # Restore in case flutter create touched them.
          cp pubspec.yaml.bak pubspec.yaml
          rm -rf lib && mv lib.bak lib
          rm pubspec.yaml.bak

      # The app was originally fully offline (TECHNICAL_DOCUMENTATION.md §10),
      # but Google Sign-In + Drive backup require network access, so INTERNET
      # is now added. The app remains fully functional offline / signed-out.
      # We also add the runtime permissions required by
      # flutter_local_notifications and exact-alarm reminders.
      - name: Patch AndroidManifest.xml (permissions)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          echo "Before patch:"
          cat $MANIFEST

          # Insert required permissions right after the opening <manifest ...>
          # tag if they aren't already present.
          if ! grep -q "POST_NOTIFICATIONS" $MANIFEST; then
            sed -i 's|<manifest |<manifest |; /<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>' $MANIFEST
          fi

          # Rename the launcher label to the brand (Feature 5). flutter create
          # sets it from the project name; override every android:label.
          sed -i 's/android:label="[^"]*"/android:label="قرشين - Qirshayn"/g' $MANIFEST

          echo "After patch:"
          cat $MANIFEST

      - name: Patch android/app/build.gradle.kts (minSdk 24, desugaring)
        run: |
          GRADLE=android/app/build.gradle.kts
          if [ ! -f "$GRADLE" ]; then GRADLE=android/app/build.gradle; fi
          echo "Using: $GRADLE"

          # Relax the strict Kotlin/Java JVM-target consistency check. Some
          # plugins (e.g. flutter_timezone) compile Kotlin to 1.8 while Java
          # targets 11; the bytecode is compatible but newer Gradle fails the
          # validation. `ignore` lets the build proceed.
          if ! grep -q "kotlin.jvm.target.validation.mode" android/gradle.properties 2>/dev/null; then
            echo "kotlin.jvm.target.validation.mode=ignore" >> android/gradle.properties
          fi

          # Bump minSdk to 24.
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' "$GRADLE"
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' "$GRADLE"
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 24/g' "$GRADLE"

          # Bump compileSdk + targetSdk to 36 — file_picker's transitive dep
          # flutter_plugin_android_lifecycle requires compileSdk >= 36.
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' "$GRADLE"
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' "$GRADLE"
          sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 36/g' "$GRADLE"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' "$GRADLE"
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/g' "$GRADLE"
          sed -i 's/targetSdkVersion = flutter.targetSdkVersion/targetSdkVersion = 36/g' "$GRADLE"

          # Append a dependencies block enabling core library desugaring.
          if ! grep -q "desugar_jdk_libs" "$GRADLE"; then
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n' >> "$GRADLE"
          fi

          # Inject compileOptions into the android { } block via a python helper —
          # easier than wrestling with sed for multi-line inserts in YAML.
          python3 - "$GRADLE" <<'PYEOF'
          import re, sys
          path = sys.argv[1]
          src = open(path, encoding='utf-8').read()
          if 'isCoreLibraryDesugaringEnabled' not in src:
              block = (
                  '    compileOptions {\n'
                  '        isCoreLibraryDesugaringEnabled = true\n'
                  '        sourceCompatibility = JavaVersion.VERSION_17\n'
                  '        targetCompatibility = JavaVersion.VERSION_17\n'
                  '    }\n'
              )
              # Insert immediately after the first `android {` line.
              src = re.sub(r'(android\s*\{\s*\n)', r'\1' + block, src, count=1)
              open(path, 'w', encoding='utf-8').write(src)
              print('Injected compileOptions block.')
          else:
              print('compileOptions already present.')
          PYEOF

          echo "--- Gradle file after patch ---"
          cat "$GRADLE"

          # Force compileSdk 36 on every plugin subproject (file_picker's
          # transitive dep flutter_plugin_android_lifecycle requires it). Must
          # be PREPENDED to android/build.gradle.kts — appending it runs after
          # subprojects are already evaluated, which Gradle rejects with
          # "Cannot run Project.afterEvaluate when the project is already evaluated".
          ROOT_GRADLE=android/build.gradle.kts
          if [ ! -f "$ROOT_GRADLE" ]; then ROOT_GRADLE=android/build.gradle; fi
          if ! grep -q "compileSdkVersion(36)" "$ROOT_GRADLE"; then
            python3 - "$ROOT_GRADLE" <<'PYEOF'
          import sys
          path = sys.argv[1]
          original = open(path, encoding='utf-8').read()
          prefix = (
              'subprojects {\n'
              '    afterEvaluate {\n'
              '        val androidExtension = extensions.findByName("android")\n'
              '        if (androidExtension is com.android.build.gradle.BaseExtension) {\n'
              '            androidExtension.compileSdkVersion(36)\n'
              '        }\n'
              '    }\n'
              '}\n\n'
          )
          open(path, 'w', encoding='utf-8').write(prefix + original)
          print('Prepended subprojects compileSdk override.')
          PYEOF
          fi

          echo "--- Root gradle file after patch ---"
          cat "$ROOT_GRADLE"

      # Google Sign-In requires the APK's signing SHA-1 to be registered in the
      # Google Cloud Console. Without these secrets the release APK is signed
      # with an EPHEMERAL debug key (different every run) and sign-in will fail
      # with error 10 / DEVELOPER_ERROR. See README "Google Sign-In & Drive
      # Backup" for how to create the keystore and secrets.
      - name: Configure release signing (optional, from secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret - release stays on the ephemeral debug key (Google Sign-In will NOT work in this APK)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.keystore"
          } > android/key.properties

          GRADLE=android/app/build.gradle.kts
          python3 - "$GRADLE" <<'PYEOF'
          import re, sys
          path = sys.argv[1]
          src = open(path, encoding='utf-8').read()
          if 'key.properties' not in src:
              # Load key.properties after the plugins block (imports must stay first).
              loader = (
                  '\nval keystoreProperties = java.util.Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))\n'
                  '}\n'
              )
              m = re.search(r'plugins\s*\{[^}]*\}\n', src)
              insert_at = m.end() if m else 0
              src = src[:insert_at] + loader + src[insert_at:]
              # signingConfigs block right inside android { }.
              signing = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            keyAlias = keystoreProperties["keyAlias"] as String\n'
                  '            keyPassword = keystoreProperties["keyPassword"] as String\n'
                  '            storeFile = file(keystoreProperties["storeFile"] as String)\n'
                  '            storePassword = keystoreProperties["storePassword"] as String\n'
                  '        }\n'
                  '    }\n'
              )
              src = re.sub(r'(android\s*\{\s*\n)', r'\1' + signing, src, count=1)
              src = src.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")')
              open(path, 'w', encoding='utf-8').write(src)
              print('Release signing configured from secrets.')
          else:
              print('Signing already configured.')
          PYEOF

      - name: flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Code generation (Drift, etc.)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Static analysis
        run: flutter analyze --no-fatal-warnings || true

      - name: Run unit tests
        run: flutter test

      - name: Build APK
        env:
          BUILD_MODE: ${{ github.event.inputs.build_mode || 'release' }}
        run: |
          echo "Building in mode: $BUILD_MODE"
          flutter build apk --$BUILD_MODE

      - name: Locate APK
        id: apk
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lah build/app/outputs/flutter-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-budget-manager-${{ github.event.inputs.build_mode || 'release' }}.apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
